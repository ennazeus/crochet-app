name: 🐞 Bug report
description: Something isn’t working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem 💛  
        A few details really help me understand what’s going on.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
      placeholder: Describe the issue in your own words
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (if possible)
      description: How can the issue be reproduced?
      placeholder: |
        1. Go to…
        2. Click…
        3. See error…
    validations:
      required: false

  - type: textarea
    id: device
    attributes:
      label: Device / browser
      description: Optional, but helpful
      placeholder: e.g. Mobile (iPhone), Desktop (Chrome)
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots or extra details (optional)
    validations:
      required: false
